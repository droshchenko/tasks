name: Release task-manager-rest-api
# Triggered by a published GitHub release, not by a bare tag push: a release is a deliberate act with
# notes attached, whereas a tag can be pushed by accident and is silently rewritable.
on:
  release:
    types: [published]

env:
  DIR: task-manager-rest-api
  # The pre-baked dependency graph — see build-task-manager-rest-api-docker.yaml, which is run BY HAND and
  # produces this. Compiling only the delta against it is the difference between a two-minute release and a
  # ten-minute one.
  BUILD_IMAGE: ghcr.io/${{ github.repository_owner }}/task-manager-rest-api-build-docker

jobs:
  build:
    # The trigger cannot filter by tag, so the job does: a release of the other service must not rebuild
    # this one.
    if: startsWith(github.event.release.tag_name, 'task-manager-rest-api-')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Get the version
        id: get_version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG##*-}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Updating version
        run: |
          cd ${DIR}
          sed -i -e 's/^version = .*/version = "${{ steps.get_version.outputs.VERSION }}"/' Cargo.toml

      # Before the pull as well as before the push: the builder image is private to the org.
      - name: Docker login
        run: |
          echo "${{ secrets.PUBLISH_TOKEN }}" | docker login https://ghcr.io -u "${{ github.actor }}" --password-stdin

      # A MISSING BUILDER MUST NEVER BREAK A RELEASE. This step is allowed to fail — no image pushed yet,
      # ghcr down, the token unable to read it — and the cold steps behind the `if:` below are the exact
      # build used before the image existed. That failure costs the ten minutes we used to pay anyway.
      #
      # THE FALLBACK IS ON THE PULL, NOT ON THE BUILD, and it is worth knowing which case that leaves out:
      # if the pull SUCCEEDS and the warm build then fails — a new crate needing a system package the image
      # was baked without, toolchain drift, a corrupt CARGO_HOME — the job fails outright and no cold build
      # is attempted. Since the image is `latest` and only ever written by hand, that state is sticky: every
      # release keeps failing until somebody re-dispatches build-task-manager-rest-api-docker.yaml. THAT is
      # the fix when a release dies inside the warm step; do not go looking for a bug in this file.
      #
      # Deliberately left as the shared pattern rather than hardened here — this workflow is generated from
      # the app-bootstrap guide and is identical across every adopting service, and a local improvement is a
      # local divergence nobody else gets. Harden it in the guide or not at all.
      - name: Pull the builder image
        id: builder
        continue-on-error: true
        run: docker pull ${BUILD_IMAGE}:latest

      # The checkout is mounted over /src — the same absolute path the image baked at, which is what makes
      # cargo's fingerprints match. Only this crate and task-manager-shared recompile: actions/checkout
      # stamps every file with the checkout time, so cargo considers our own sources dirty regardless. That
      # is expected and cheap. The dependency sources keep their baked mtimes inside the image's CARGO_HOME,
      # and that graph is the nine minutes.
      #
      # ${DIR} is expanded by the RUNNER before `docker run`, which is why the inner `bash -c` is in double
      # quotes — the container has no DIR. The copy at the end puts the binary where the runtime Dockerfile
      # expects it, since CARGO_TARGET_DIR points outside the mount.
      - name: Build (warm, in the builder image)
        if: steps.builder.outcome == 'success'
        run: |
          docker run --rm \
            -v "${PWD}:/src" \
            -w /src/${DIR} \
            ${BUILD_IMAGE}:latest \
            bash -c "cargo build --release \
              && mkdir -p target/release \
              && cp /build/target/release/${DIR} target/release/${DIR}"

      - uses: actions-rust-lang/setup-rust-toolchain@v1.15.2
        if: steps.builder.outcome != 'success'
        with:
          toolchain: stable
          rustflags: ""

      # Not about our own protos — we have none. service-sdk pulls in `my-telemetry-writer`, whose build
      # script runs prost-build, so protoc is required regardless.
      - name: Install protoc
        if: steps.builder.outcome != 'success'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build (cold, on the runner)
        if: steps.builder.outcome != 'success'
        run: |
          export GIT_HUB_TOKEN="${{ secrets.PUBLISH_TOKEN }}"
          cd ${DIR}
          cargo build --release

      - name: Docker Build and Publish
        run: |
          # `ghcr.io/{org}/{service}` per the release guide — flat, not nested under the repo name.
          # Both halves are derived rather than written out: the owner from the repository, the service
          # from DIR. Spelling the org by hand is how the first release landed in the wrong one.
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/${DIR}"
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          echo "publishing ${IMAGE_NAME}:${VERSION}"
          cd ${DIR}
          docker build -t ${IMAGE_NAME}:${VERSION} .
          docker push ${IMAGE_NAME}:${VERSION}
