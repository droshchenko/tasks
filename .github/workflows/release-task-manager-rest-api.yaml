name: Release task-manager-rest-api
on:
  push:
    tags:
      - "task-manager-rest-api-*"

env:
  DIR: task-manager-rest-api

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      # Not about our own protos — we have none. service-sdk pulls in `my-telemetry-writer`, whose build
      # script runs prost-build, so protoc is required regardless.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Get the version
        id: get_version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG##*-}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Updating version
        run: |
          cd ${DIR}
          sed -i -e 's/^version = .*/version = "${{ steps.get_version.outputs.VERSION }}"/' Cargo.toml

      - run: |
          export GIT_HUB_TOKEN="${{ secrets.PUBLISH_TOKEN }}"
          cd ${DIR}
          cargo build --release

      - name: Docker login
        run: |
          echo "${{ secrets.PUBLISH_TOKEN }}" | docker login https://ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Docker Build and Publish
        run: |
          # Nothing about the image name is written out by hand: the owner and repo come from the
          # repository itself, and the service from DIR. Spelling the org out is how the first release
          # ended up in the wrong one.
          IMAGE_NAME="ghcr.io/${{ github.repository }}/${DIR}"
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          echo "publishing ${IMAGE_NAME}:${VERSION}"
          cd ${DIR}
          docker build -t ${IMAGE_NAME}:${VERSION} .
          docker push ${IMAGE_NAME}:${VERSION}
