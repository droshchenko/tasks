name: Build task-manager-rest-api-build-docker
# The pre-baked builder image, and the reason a release takes two minutes instead of ten.
#
# A release used to spend almost all of its time rebuilding a dependency graph that had not changed —
# service-sdk, my-postgres, my-http-server, tokio, jemalloc (a configure+make build of its own). None of
# that moves between releases, so it is compiled ONCE here, into an image, and every release mounts fresh
# sources over it and compiles only the delta.
#
# `workflow_dispatch` ONLY, and that is the point rather than a limitation: there is no Docker daemon on a
# dev machine, so a builder image can only be tested where it is built. Iterating on it through release tags
# would mean burning a version number per attempt.
#
# RUN THIS BY HAND whenever the dependency GRAPH moves — a MyJetTools tag bumped, a crate added,
# `Cargo.lock` updated. Nothing else needs it: ordinary changes to our own code are the delta the release
# compiles.

on:
  workflow_dispatch:

env:
  # Derived rather than written out, the same rule the release workflow follows: spelling the org by hand
  # is how the first release landed in the wrong one.
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/task-manager-rest-api-build-docker
  DIR: task-manager-rest-api

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Docker login
        run: |
          echo "${{ secrets.PUBLISH_TOKEN }}" | docker login https://ghcr.io -u "${{ github.actor }}" --password-stdin

      # Written over the RUNTIME Dockerfile, here in the runner's throwaway checkout. So the service folder
      # keeps exactly one Dockerfile — the runtime one, which is what anybody looking there expects to find.
      #
      # The heredoc is QUOTED (<<'DOCKERFILE'). Unquoted, the runner's shell would expand `$PATH` inside
      # `ENV PATH=...:$PATH` and bake the RUNNER's PATH into the image.
      - name: Generate the builder Dockerfile
        run: |
          cat > ${DIR}/Dockerfile <<'DOCKERFILE'
          # Must match the RUNTIME image's base. The binary is copied into the runtime image rather than
          # rebuilt there, so a newer base here links it against a newer glibc and the container dies at
          # start-up on a symbol lookup.
          FROM ubuntu:22.04

          ENV DEBIAN_FRONTEND=noninteractive
          # BOTH of these must live outside /src. The release bind-mounts its checkout over /src, and a bind
          # mount HIDES whatever the image had underneath — a cargo home or a target dir in there would
          # vanish at exactly the moment it is supposed to be reused, turning a warm build into a cold one
          # with no error to show for it.
          ENV CARGO_HOME=/usr/local/cargo
          ENV CARGO_TARGET_DIR=/build/target
          ENV PATH=/usr/local/cargo/bin:$PATH

          # More than protoc, and each of these is load-bearing for this graph:
          #   build-essential  — jemalloc (tikv-jemalloc-sys) is a configure+make build
          #   libprotobuf-dev  — protoc without the well-known types is not protoc; my-telemetry-writer's
          #                      build script runs prost-build, so this is needed even though we own no protos
          #   libssl-dev       — postgres-openssl
          #   git              — every MyJetTools dependency is a git tag
          RUN apt-get update && apt-get install -y --no-install-recommends \
                  build-essential \
                  ca-certificates \
                  curl \
                  git \
                  libprotobuf-dev \
                  libssl-dev \
                  pkg-config \
                  protobuf-compiler \
              && rm -rf /var/lib/apt/lists/*

          RUN curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal

          # The whole repo, at /src — the SAME absolute path the release mounts over. Cargo fingerprints
          # record absolute paths, so baking at any other path produces a cold build wearing a warm image's
          # name. The whole repo rather than the one folder because task-manager-shared is a path dependency.
          COPY . /src

          RUN cd /src/task-manager-rest-api && cargo build --release

          # Emptied on purpose. An image run WITHOUT the release's bind mount would otherwise compile the
          # sources baked in at build time and look exactly like it had worked.
          RUN rm -rf /src && mkdir -p /src

          WORKDIR /src/task-manager-rest-api
          DOCKERFILE
          cat ${DIR}/Dockerfile

      # Context is the REPO ROOT, not the service folder: task-manager-shared arrives as a path dependency.
      #
      # No `--build-arg` carrying a token, and there must never be one: a build arg is written into the
      # image history, where anybody who can pull the image can read it back. Every MyJetTools and
      # my-ai-utils dependency is a public repository, so none is needed. If a private one ever appears,
      # use a BuildKit secret mount.
      - name: Build and push the builder image
        run: |
          docker build -f ${DIR}/Dockerfile -t ${IMAGE_NAME}:latest .
          docker push ${IMAGE_NAME}:latest
