name: Release task-manager-ui
# Triggered by a published GitHub release, not by a bare tag push: a release is a deliberate act with
# notes attached, whereas a tag can be pushed by accident and is silently rewritable.
on:
  release:
    types: [published]

env:
  DIR: task-manager-ui
  APP_NAME: task-manager-ui
  DELIVER_NAME: task-manager-ui

jobs:
  build:
    # The trigger cannot filter by tag, so the job does: a release of the other service must not rebuild
    # this one.
    if: startsWith(github.event.release.tag_name, 'task-manager-ui-')
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/myjettools/dioxus-docker:0.7.10
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Get the version
        id: get_version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG##*-}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Updating version
        run: |
          cd ${DIR}
          sed -i -e 's/^version = .*/version = "${{ steps.get_version.outputs.VERSION }}"/' Cargo.toml

      - run: |
          export GIT_HUB_TOKEN="${{ secrets.PUBLISH_TOKEN }}"
          cd ${DIR}
          dx build --release --web
          ls ./target/dx/${APP_NAME}/release/web/public
          python3 build.py ./target/dx/${APP_NAME}/release/web/public/index.html

      - name: Zip and upload
        run: |
          cd ${DIR}
          FILE_NAME="https://jetdev.eu/file/${DELIVER_NAME}-build.zip"
          echo $FILE_NAME
          apt install zip
          zip -r data.zip ./target/dx/${APP_NAME}/release/web ./Dockerfile
          curl -X 'POST' $FILE_NAME -H 'accept: */*' -H 'Content-Type: multipart/form-data' -F 'file=@data.zip;type=application/zip'

  publish:
    if: startsWith(github.event.release.tag_name, 'task-manager-ui-')
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Download Build Artifacts
        run: |
          cd ${DIR}
          FILE_NAME="https://jetdev.eu/file/${DELIVER_NAME}-build.zip"
          echo $FILE_NAME
          curl -L -o data.zip $FILE_NAME
          unzip -o data.zip

      - name: Get the version
        id: get_version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG##*-}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Docker login
        run: |
          echo "${{ secrets.PUBLISH_TOKEN }}" | docker login https://ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Docker Build and Publish
        run: |
          # `ghcr.io/{org}/{service}` per the release guide — flat, not nested under the repo name.
          # Both halves are derived rather than written out: the owner from the repository, the service
          # from DIR. Spelling the org by hand is how the first release landed in the wrong one.
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/${DIR}"
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          echo "publishing ${IMAGE_NAME}:${VERSION}"
          cd ${DIR}
          docker build -t ${IMAGE_NAME}:${VERSION} .
          docker push ${IMAGE_NAME}:${VERSION}
