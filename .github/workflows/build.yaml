name: Build

# Every push and every pull request. The release workflows only fire on a tag, so without this a broken
# commit would sit on main unnoticed until somebody tried to release it.
on:
  push:
    branches:
    - "**"
    tags-ignore:
    - "**"
  pull_request:

jobs:
  # `task-manager-shared` and `task-manager-rest-api` are checked together: the shared crate is a path
  # dependency of the service, so a change to it can only be judged by building both.
  backend:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        components: rustfmt, clippy
        # The shared crate exists to compile to wasm — checking only the native target would miss exactly
        # the mistake that matters, a server-only dependency creeping into it.
        target: wasm32-unknown-unknown

    # Not optional and not about our own protos — we have none. service-sdk pulls in
    # `my-telemetry-writer`, whose build script runs prost-build, so protoc is required regardless.
    - name: Install protoc
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: task-manager-shared
      run: |
        export GIT_HUB_TOKEN="${{ secrets.PUBLISH_TOKEN }}"
        cd task-manager-shared
        cargo fmt --check
        cargo clippy --features server --all-targets -- -D warnings
        cargo test
        cargo build --target wasm32-unknown-unknown

    - name: task-manager-rest-api
      run: |
        export GIT_HUB_TOKEN="${{ secrets.PUBLISH_TOKEN }}"
        cd task-manager-rest-api
        cargo fmt --check
        cargo clippy --all-targets -- -D warnings
        cargo test

  # Built in the same container the release workflow uses, so a UI that builds here builds there.
  ui:
    runs-on: ubuntu-22.04
    container:
      image: myjettools/dioxus-docker:0.7.3
    steps:
    - uses: actions/checkout@v6.0.2

    # No `actions-rs/toolchain` here. The image already ships a Rust toolchain and `dx`, and that action
    # installs its own alongside — leaving `cargo fmt` missing from the one actually in use, which is
    # exactly how this job failed the first time.
    - name: Toolchain components
      run: |
        rustup component add rustfmt clippy
        rustup target add wasm32-unknown-unknown

    - name: task-manager-ui
      run: |
        export GIT_HUB_TOKEN="${{ secrets.PUBLISH_TOKEN }}"
        cd task-manager-ui
        cargo fmt --check
        # Clippy against wasm32: the crate never builds for anything else, and a lint that only fires on
        # the native target would be noise while a real one could hide.
        cargo clippy --target wasm32-unknown-unknown -- -D warnings
        # `dx build`, not `cargo build` — the CSS pipeline and the asset bundling only happen here, so a
        # cargo-only check would pass on a project that cannot actually produce a bundle.
        dx build
