[package]
name = "task-manager-ui"
version = "0.1.0"
edition = "2024"

[features]
default = ["web"]
web = ["dioxus/web"]

[dependencies]
dioxus = { version = "0.7.9", features = ["router"] }
dioxus-utils = { tag = "0.7.0", git = "https://github.com/MyJetTools/dioxus-utils.git", features = [
    "web",
] }

# The wire contract, reused verbatim from the server. No `server` feature here — the client only needs
# the schema plus the FlUrl request builder.
task-manager-shared = { path = "../task-manager-shared" }
# FlUrl compiles to the browser fetch API under wasm and resolves relative "/api/..." URLs against the
# page origin, so no base URL is ever computed.
flurl = { tag = "0.7.0", git = "https://github.com/MyJetTools/fl-url.git" }
# Names the `THttpRequestBuilder` bound the authed-request helpers are written against.
my-http-utils = { tag = "0.1.0", git = "https://github.com/MyJetTools/my-http-utils.git" }
# `KindColor` — the palette a kind's colour is drawn from, and `AsStr` to read it.
rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git" }

# The WebSocket Home holds open. Browser API, so no custom headers — the token rides in the query.
reqwasm = "*"
futures = { version = "*" }

# A task's text is Markdown. Safe by default: `markdown::to_html` escapes raw HTML rather than passing
# it through, which matters because the text is written by agents.
markdown = { version = "1" }

serde = { version = "*", features = ["derive"] }
serde_json = { version = "*" }

web-sys = { version = "*", features = [
    "Storage",
    "Window",
    "console",
    # Reading `?code=`/`?state=` off the OAuth callback and the `?task=` share link, and replacing the
    # URL afterwards so a reload does not re-submit a spent code.
    "Location",
    "History",
] }
js-sys = { version = "*" }
# `JsValue::from_str` for the console helper, and the state argument of `History::replace_state_with_url`.
wasm-bindgen = { version = "*" }

[build-dependencies]
ci-utils = { git = "https://github.com/MyJetTools/ci-utils.git", tag = "0.1.3" }

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
